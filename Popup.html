<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 280px;
        font-family:
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
        padding: 14px;
        margin: 0;
        background: #fff;
      }
      h3 {
        margin: 0 0 2px 0;
        font-size: 18px;
      }
      small {
        color: #888;
        font-size: 12px;
        display: block;
        margin-bottom: 12px;
      }
      button {
        width: 100%;
        padding: 12px;
        background: #6c5ce7;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-weight: 600;
        margin-top: 8px;
        font-size: 14px;
      }
      button#saveHtml {
        background: #2d3436;
      }
      #status {
        margin-top: 10px;
        font-size: 12px;
        color: #10ac84;
        min-height: 14px;
      }
      .footer {
        margin-top: 14px;
        padding-top: 10px;
        border-top: 1px solid #eee;
        text-align: center;
        color: #999;
        font-size: 11px;
      }
      .footer a {
        color: #6c5ce7;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <h3>ChatVault</h3>
    <small>ChatGPT saver - perfect tables &amp; code</small>
    <button id="saveMd">Save as Markdown (.md)</button>
    <button id="saveHtml">Save as HTML (.html) - View &amp; Print</button>
    <div id="status"></div>

    <div class="footer">
      Made with &#10084;&#65039; by Pratik &#9679;
      <a href="https://github.com" target="_blank">GitHub</a>
      <!-- change the URL here - replace https://github.com with your repo url -->
    </div>

    <script src="popup.js"></script>
  </body>
</html>
